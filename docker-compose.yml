version: '3.8'

services:
  db:
    image: postgres:16
    container_name: tienda_db
    restart: always
    environment:
      POSTGRES_USER: tienda_user
      POSTGRES_PASSWORD: tienda_pass
      POSTGRES_DB: tienda_online
    ports:
      - "5432:5432"
    volumes:
      - tienda_data:/var/lib/postgresql/data

  pgadmin:
    image: dpage/pgadmin4
    container_name: tienda_pgadmin
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@tienda.com
      PGADMIN_DEFAULT_PASSWORD: admin123
    ports:
      - "5050:80"
    depends_on:
      - db

volumes:
  tienda_data:
